# CaelusOS Picom Compositor Configuration (Glassmorphism & Blur Tokens)

# Backend
backend = "glx";
vsync = true;
glx-no-stencil = true;
glx-no-rebind-pixmap = true;

# Rounded Corners
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# Dual-Kawase Blur
blur: {
  method = "dual_kawase";
  strength = 6;
  background = true;
  background-frame = false;
  background-fixed = false;
};

# Opacity Rules (Opacity Token: 0.92)
active-opacity = 1.0;
inactive-opacity = 0.92;
frame-opacity = 0.90;
inactive-opacity-override = false;

opacity-rule = [
  "92:class_g = 'Alacritty'",
  "92:class_g = 'Thunar'",
  "92:class_g = 'Rofi'"
];

# Fading & Shadows
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.40;
shadow-offset-x = -12;
shadow-offset-y = -12;
