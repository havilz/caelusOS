# CaelusOS Terminal Color Theme (Deep Space Dark & Electric Cyan)

[window]
padding = { x = 12, y = 12 }
opacity = 0.92

[font]
size = 11.0

[font.normal]
family = "FiraCode Nerd Font"
style = "Regular"

[colors.primary]
background = "#0f111a"
foreground = "#e2e8f0"

[colors.cursor]
text = "#0f111a"
cursor = "#00d2ff"

[colors.normal]
black   = "#1a1d2e"
red     = "#ff5555"
green   = "#50fa7b"
yellow  = "#f1fa8c"
blue    = "#00d2ff"
magenta = "#7928ca"
cyan    = "#8be9fd"
white   = "#e2e8f0"

[colors.bright]
black   = "#44475a"
red     = "#ff6e6e"
green   = "#69ff94"
yellow  = "#ffffa5"
blue    = "#33e0ff"
magenta = "#9442e6"
cyan    = "#a4f0ff"
white   = "#ffffff"
