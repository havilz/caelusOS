name: Build CaelusOS ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - dev

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Live-Build & Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin

      - name: Make Scripts Executable
        run: |
          chmod +x builder/scripts/build-iso.sh
          chmod +x builder/scripts/clean-build.sh

      - name: Build CaelusOS ISO Image & Capture Log
        run: |
          sudo mkdir -p docs
          sudo chmod 777 docs
          sudo ./builder/scripts/build-iso.sh 2>&1 | sudo tee docs/CI/CD_LOG.md

      - name: Auto-Commit Build Log to Repository
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(ci): auto-update docs/CI/CD_LOG.md build log"
          file_pattern: "docs/CI/CD_LOG.md"

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CI-CD-Log
          path: docs/CI/CD_LOG.md

      - name: Upload ISO Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CaelusOS-ISO
          path: builder/out/caelusOS-live-amd64.iso*
          retention-days: 7
